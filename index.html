<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ericzzy.fun</title>
  <meta name="description" content="中小学及高中知识图谱与自适应诊断。">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }
    .entry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      min-height: 56px;
      padding: 14px 28px;
      border-radius: 16px;
      background: #0f6e62;
      color: #fff;
      font-size: 20px;
      font-weight: 650;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(15, 110, 98, 0.18);
    }
    .entry:hover { background: #0c574e; }
    .entry:focus-visible { outline: 3px solid #0f6e62; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <a class="entry" href="/knowledge-graph/">知识图谱</a>
  </main>
</body>
</html>
