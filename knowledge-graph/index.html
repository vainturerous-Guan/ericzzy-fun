<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跳转中 · ericzzy.fun</title>
<script>
(function () {
  var id = location.hash.replace(/^#/, '');
  try { id = decodeURIComponent(id); } catch (e) { id = ''; }
  var subjectById = [
    [/^cne_[A-Za-z0-9]+$/, 'english'],
    [/^cnp_[A-Za-z0-9]+$/, 'physics'],
    [/^cnc_[A-Za-z0-9]+$/, 'chinese'],
    [/^cns_[A-Za-z0-9]+$/, 'science'],
    [/^cnd_[A-Za-z0-9]+$/, 'morality'],
    [/^cnh_[A-Za-z0-9]+$/, 'history'],
    [/^cng_[A-Za-z0-9]+$/, 'geography'],
    [/^cnb_[A-Za-z0-9]+$/, 'biology'],
    [/^cnk_[A-Za-z0-9]+$/, 'chemistry']
  ];
  if (/^cnm_[A-Za-z0-9]+$/.test(id)) {
    location.replace('explore/#' + encodeURIComponent(id));
    return;
  }
  for (var i = 0; i < subjectById.length; i++) {
    if (subjectById[i][0].test(id)) {
      location.replace('explore/?subject=' + subjectById[i][1] + '#' + encodeURIComponent(id));
      return;
    }
  }
  location.replace('/about/' + location.search);
})();
</script>
</head>
<body>
<p>页面已搬到 <a href="/about/">网站介绍</a>，正在跳转……</p>
</body>
</html>
